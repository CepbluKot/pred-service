# Секреты для ClickHouse — передаются в Pod через Airflow Variables.
# Этот файл — шаблон. Значения заполнить перед применением
# или использовать External Secrets / Vault.
#
# Применять: kubectl apply -f k8s/secret.yaml -n airflow
#
# В Airflow Variables (Admin → Variables) прописать:
#   PRED_CH_HOST      — хост ClickHouse
#   PRED_CH_PORT      — порт (обычно 8123)
#   PRED_CH_USER      — пользователь
#   PRED_CH_PASSWORD  — пароль
#   PRED_CH_DATABASE  — база данных
#   PRED_SERVICE_IMAGE     — docker image (registry.your-company.com/pred-service:latest)
#   PRED_SERVICE_NAMESPACE — namespace (airflow)
#   PRED_SERVICE_DATA_PVC  — имя PVC (pred-service-data)
#
# Альтернатива — хранить credentials в K8s Secret и монтировать
# как env через envFrom (пример ниже):

apiVersion: v1
kind: Secret
metadata:
  name: pred-service-clickhouse
  namespace: airflow
  labels:
    app: pred-service
type: Opaque
stringData:
  PRED_CH_HOST:     "clickhouse.your-company.com"
  PRED_CH_PORT:     "8123"
  PRED_CH_USER:     "pred_service"
  PRED_CH_PASSWORD: "changeme"
  PRED_CH_DATABASE: "ml"
